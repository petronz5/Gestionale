<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>DDT Cliente</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>DDT da fatturare</h2>
            <p class="text-muted mb-0">Cliente: <strong th:text="${cliente.displayName}"></strong></p>
        </div>
        <a href="/fatturazione-differita" class="btn btn-outline-secondary">← Torna ai clienti</a>
    </div>

    <form method="post" action="/fatturazione-differita/genera">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="clienteId" th:value="${cliente.id}"/>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 40px;" class="text-center">
                            <input class="form-check-input" type="checkbox" id="selectAll" checked
                                   onclick="document.querySelectorAll('.ddt-check').forEach(cb => cb.checked = this.checked)">
                        </th>
                        <th>N° Documento</th>
                        <th>Data</th>
                        <th>Causale</th>
                        <th>Voci/Righe</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${ddts}">
                        <td class="text-center">
                            <input class="form-check-input ddt-check" type="checkbox" name="ddtIds" th:value="${d.id}" checked>
                        </td>
                        <td class="fw-semibold">DDT n. <span th:text="${d.numero}"></span></td>
                        <td th:text="${#temporals.format(d.dataDocumento,'dd/MM/yyyy')}"></td>
                        <td th:text="${d.causaleTrasporto}"></td>
                        <td><span class="badge bg-primary rounded-pill" th:text="${#lists.size(d.righe)}"></span> righe</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success px-4 py-2 fs-5">
                <i class="bi bi-receipt me-2"></i>Genera Fattura Unica
            </button>
        </div>
    </form>
</section>
</body>
</html>
