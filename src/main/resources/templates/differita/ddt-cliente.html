<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Riepilogo DDT Cliente', ~{::section})}">
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">DDT da fatturare</h2>
            <p class="text-slate-500 mt-1">Cliente: <strong class="text-indigo-600" th:text="${cliente.displayName}"></strong></p>
        </div>
        <a href="/fatturazione-differita" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
            <i class="bi bi-arrow-left me-2"></i>Torna indietro
        </a>
    </div>

    <form method="post" action="/fatturazione-differita/genera">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="clienteId" th:value="${cliente.id}"/>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 font-medium text-center w-16">
                            <input class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500" type="checkbox" id="selectAll" checked
                                   onclick="document.querySelectorAll('.ddt-check').forEach(cb => cb.checked = this.checked)">
                        </th>
                        <th class="px-6 py-4 font-medium">N° Documento</th>
                        <th class="px-6 py-4 font-medium">Data</th>
                        <th class="px-6 py-4 font-medium">Causale</th>
                        <th class="px-6 py-4 font-medium text-right">Voci/Righe</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                    <tr th:each="d : ${ddts}" class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-center">
                            <input class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 ddt-check" type="checkbox" name="ddtIds" th:value="${d.id}" checked>
                        </td>
                        <td class="px-6 py-4 font-bold text-slate-800">DDT n. <span th:text="${d.numero}"></span></td>
                        <td class="px-6 py-4 text-sm text-slate-600" th:text="${d.dataDocumento != null ? #temporals.format(d.dataDocumento,'dd/MM/yyyy') : '—'}"></td>
                        <td class="px-6 py-4 text-sm text-slate-600" th:text="${d.causaleTrasporto}"></td>
                        <td class="px-6 py-4 text-right">
                            <span class="px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-md text-xs font-bold" th:text="${#lists.size(d.righe)} + ' righe'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-sm transition-colors flex items-center text-lg">
                <i class="bi bi-receipt me-2"></i>Genera Fattura Unica
            </button>
        </div>
    </form>
</section>
</body>
</html>
