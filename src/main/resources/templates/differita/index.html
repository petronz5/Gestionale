<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Fatturazione Differita</title></head>
<body>
<section>
    <div class="mb-4">
        <h2>Fatturazione Differita Mensile</h2>
        <p class="text-muted">Seleziona un cliente per visualizzare i documenti di trasporto pronti per la fatturazione.</p>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="cliente : ${clienti}">
            <a th:href="@{/fatturazione-differita/cliente/{id}(id=${cliente.id})}" class="text-decoration-none">
                <div class="card border-0 shadow-sm card-hover h-100">
                    <div class="card-body text-center py-4">
                        <div class="mb-3">
                            <i class="bi bi-building fs-1 text-primary"></i>
                        </div>
                        <h5 class="fw-bold text-dark mb-1" th:text="${cliente.displayName}"></h5>
                        <div class="text-muted small">
                            <i class="bi bi-truck me-1"></i>DDT in attesa di fatturazione
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(clienti)}">
            <div class="alert alert-success border-0 shadow-sm text-center py-4">
                <i class="bi bi-check-circle fs-2 d-block mb-2"></i>
                <h5 class="fw-bold mb-0">Tutto in regola!</h5>
                <p class="mb-0 text-muted">Non ci sono DDT in sospeso da fatturare per nessun cliente.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
