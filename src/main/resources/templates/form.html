<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Articolo</title></head>
<body>
<section>
    <h2 class="mb-4" th:text="${articolo.id == null} ? 'Nuovo Articolo' : 'Modifica Articolo'"></h2>
    <form method="post" action="/articoli/salva">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase">Codice *</label>
                        <input type="text" th:field="*{codice}" class="form-control form-control-lg" required>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label text-muted small text-uppercase">Descrizione *</label>
                        <input type="text" th:field="*{descrizione}" class="form-control form-control-lg" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase">Unità di Misura</label>
                        <select th:field="*{unitaMisura}" class="form-select form-select-lg">
                            <option value="PZ">Pezzi (PZ)</option>
                            <option value="KG">Chilogrammi (KG)</option>
                            <option value="LT">Litri (LT)</option>
                            <option value="ORE">Ore (ORE)</option>
                            <option value="FORFAIT">A Forfait</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase">Prezzo Base €</label>
                        <input type="number" th:field="*{prezzoBase}" class="form-control form-control-lg" step="0.01">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase">Aliquota IVA %</label>
                        <input type="number" th:field="*{aliquotaIva}" class="form-control form-control-lg" step="0.01">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small text-uppercase">Note interne</label>
                        <textarea th:field="*{note}" class="form-control" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-floppy me-2"></i>Salva Articolo</button>
            <a href="/articoli" class="btn btn-outline-secondary px-4">Annulla</a>
        </div>
    </form>
</section>
</body>
</html>
