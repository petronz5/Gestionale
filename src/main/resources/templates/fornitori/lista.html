<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Fornitori</title></head>
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Fornitori</h2>
    <a href="/fornitori/nuovo" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>Nuovo fornitore
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Ragione sociale</th><th>P.IVA</th>
          <th>Città</th><th>Email</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${fornitori}">
          <td th:text="${f.ragioneSociale}"></td>
          <td th:text="${f.partitaIva ?: '—'}"></td>
          <td th:text="${f.citta ?: '—'}"></td>
          <td th:text="${f.email ?: '—'}"></td>
          <td class="text-end">
            <a th:href="@{/fornitori/{id}/modifica(id=${f.id})}"
               class="btn btn-sm btn-outline-primary">
              <i class="bi bi-pencil"></i>
            </a>
            <form method="post"
                  th:action="@{/fornitori/{id}/elimina(id=${f.id})}"
                  style="display:inline"
                  onsubmit="return confirm('Disattivare?')">
              <input type="hidden" th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}"/>
              <button class="btn btn-sm btn-outline-danger ms-1">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
