<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Fornitori', ~{::section})}">
<body>
<section>
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-800">Fornitori</h2>
    <a href="/fornitori/nuovo" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
      <i class="bi bi-plus-lg me-2"></i>Nuovo fornitore
    </a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
        <tr>
          <th class="px-6 py-4 font-medium">Ragione sociale</th>
          <th class="px-6 py-4 font-medium">P.IVA</th>
          <th class="px-6 py-4 font-medium">Città</th>
          <th class="px-6 py-4 font-medium">Email</th>
          <th class="px-6 py-4 font-medium text-right">Azioni</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
        <tr th:each="f : ${fornitori}" class="hover:bg-slate-50 transition-colors">
          <td class="px-6 py-4 font-semibold text-slate-800" th:text="${f.ragioneSociale}"></td>
          <td class="px-6 py-4 text-sm text-slate-600 font-mono" th:text="${f.partitaIva ?: '—'}"></td>
          <td class="px-6 py-4 text-sm text-slate-600" th:text="${f.citta ?: '—'}"></td>
          <td class="px-6 py-4 text-sm text-indigo-600" th:text="${f.email ?: '—'}"></td>
          <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
            <a th:href="@{/fornitori/{id}/modifica(id=${f.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica">
              <i class="bi bi-pencil"></i>
            </a>
            <form method="post" th:action="@{/fornitori/{id}/elimina(id=${f.id})}" class="inline-block" onsubmit="return confirm('Disattivare questo fornitore?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button class="inline-flex items-center justify-center w-8 h-8 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Elimina">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(fornitori)}">
          <td colspan="5" class="px-6 py-12 text-center text-slate-500">Nessun fornitore in anagrafica.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
