<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accesso — Gestionale</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-slate-100 font-sans antialiased flex items-center justify-center min-h-screen">

<div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border border-slate-200">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
            <i class="bi bi-briefcase-fill text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Gestionale Area PMI</h2>
        <p class="text-slate-500 text-sm mt-2">Inserisci le tue credenziali per accedere.</p>
    </div>

    <div th:if="${param.logout}" class="mb-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-sm text-center">
        Disconnessione avvenuta con successo.
    </div>
    <div th:if="${param.error}" class="mb-6 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm text-center font-medium">
        <i class="bi bi-exclamation-circle me-1"></i> Credenziali non valide o Account inesistente.
    </div>

    <form method="post" action="/login" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Username o Email</label>
            <input type="text" name="username" required autofocus
                   class="w-full border border-slate-300 rounded-lg px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full border border-slate-300 rounded-lg px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
        </div>

        <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors mt-6">
            Accedi al sistema
        </button>
    </form>

    <div class="mt-8 flex items-center justify-center">
        <div class="border-t border-slate-200 flex-grow"></div>
        <span class="px-3 text-slate-400 text-xs font-semibold uppercase tracking-wider">Oppure accedi con</span>
        <div class="border-t border-slate-200 flex-grow"></div>
    </div>

    <div class="mt-6 space-y-3">
        <a href="/oauth2/authorization/google" class="w-full flex items-center justify-center py-2.5 px-4 border border-slate-300 rounded-lg shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition-colors">
            <i class="bi bi-google text-red-500 me-3 text-lg"></i> Google
        </a>

        <a href="/oauth2/authorization/microsoft" class="w-full flex items-center justify-center py-2.5 px-4 border border-slate-300 rounded-lg shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition-colors">
            <i class="bi bi-microsoft text-blue-600 me-3 text-lg"></i> Microsoft
        </a>
    </div>
</div>

</body>
</html>
