<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Configurazione SaaS', ~{::section})}">
<body>
<section>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Impostazioni Profilo White-Label</h2>
        <p class="text-slate-500 text-sm mt-1">I dati inseriti qui verranno applicati in automatico all'intestazione dei tuoi PDF e dei tuoi file XML inviati allo SDI.</p>
    </div>

    <form method="post" action="/impostazioni/salva" th:object="${azienda}" class="max-w-4xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
            <div class="md:col-span-8">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Ragione Sociale Azienda *</label>
                <input type="text" th:field="*{ragioneSociale}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-4">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Partita IVA (Non modificabile)</label>
                <input type="text" th:field="*{partitaIva}" readonly class="w-full border border-slate-200 bg-slate-50 rounded-lg px-4 py-2 text-slate-500 font-mono">
            </div>

            <div class="md:col-span-6">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Indirizzo Sede Legale</label>
                <input type="text" th:field="*{indirizzo}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">CAP</label>
                <input type="text" th:field="*{cap}" maxlength="5" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-3">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Città</label>
                <input type="text" th:field="*{citta}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-1">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Prov.</label>
                <input type="text" th:field="*{provincia}" maxlength="2" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 uppercase text-center focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="md:col-span-4">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Email Pubblica Documenti</label>
                <input type="email" th:field="*{email}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-8">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">IBAN per Ricezione Bonifici</label>
                <input type="text" th:field="*{iban}" placeholder="IT00 X 0000 0000 0000 0000 0000" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 font-mono focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <div class="flex gap-4">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-lg shadow-sm transition-colors flex items-center">
                <i class="bi bi-check-lg me-2"></i>Aggiorna Profilo Azienda
            </button>
        </div>
    </form>
</section>
</body>
</html>
