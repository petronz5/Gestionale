<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Clienti</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Clienti</h2>
        <a href="/clienti/nuovo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuovo cliente
        </a>
    </div>

    <!-- Ricerca -->
    <form method="get" action="/clienti" class="mb-3">
        <div class="input-group" style="max-width:400px">
            <input type="text" name="q" class="form-control"
                   placeholder="Cerca per nome, CF, P.IVA…"
                   th:value="${q}">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </form>

    <!-- Tabella -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nominativo</th>
                    <th>Cod. Fiscale / P.IVA</th>
                    <th>Città</th>
                    <th>Telefono</th>
                    <th>Email</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clienti}">
                    <td>
                        <a th:href="@{/clienti/{id}(id=${c.id})}"
                           class="text-decoration-none fw-semibold"
                           th:text="${c.displayName}"></a>
                    </td>
                    <td th:text="${c.codiceFiscale ?: c.partitaIva ?: '—'}"></td>
                    <td th:text="${c.citta ?: '—'}"></td>
                    <td th:text="${c.telefono ?: '—'}"></td>
                    <td th:text="${c.email ?: '—'}"></td>
                    <td class="text-end">
                        <a th:href="@{/clienti/{id}/modifica(id=${c.id})}"
                           class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post"
                              th:action="@{/clienti/{id}/elimina(id=${c.id})}"
                              style="display:inline"
                              onsubmit="return confirm('Disattivare questo cliente?')">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clienti)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Nessun cliente trovato.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
