<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Cliente</title></head>
<body>
<section>
  <h2 class="mb-4"
      th:text="${cliente.id == null} ? 'Nuovo cliente' : 'Modifica cliente'"></h2>

  <form method="post" action="/clienti/salva">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-header bg-white fw-semibold">Dati anagrafici</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select th:field="*{tipo}" class="form-select">
              <option th:each="t : ${tipi}" th:value="${t}"
                      th:text="${t == T(com.studicommerciali.gestionale.entity.Cliente.TipoCliente).PERSONA_FISICA ? 'Persona fisica' : 'Persona giuridica'}"></option>
            </select>
          </div>
          <div class="col-md-9">
            <label class="form-label">Ragione sociale / Cognome e nome *</label>
            <input type="text" th:field="*{ragioneSociale}"
                   class="form-control" required>
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('ragioneSociale')}"
                 th:errors="*{ragioneSociale}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Codice fiscale</label>
            <input type="text" th:field="*{codiceFiscale}"
                   class="form-control" maxlength="16">
          </div>
          <div class="col-md-4">
            <label class="form-label">Partita IVA</label>
            <input type="text" th:field="*{partitaIva}"
                   class="form-control" maxlength="11">
          </div>
          <div class="col-md-4">
            <label class="form-label">Codice SDI</label>
            <input type="text" th:field="*{codiceSdi}"
                   class="form-control" maxlength="7">
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-header bg-white fw-semibold">Indirizzo e contatti</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Indirizzo</label>
            <input type="text" th:field="*{indirizzo}" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">CAP</label>
            <input type="text" th:field="*{cap}" class="form-control" maxlength="5">
          </div>
          <div class="col-md-3">
            <label class="form-label">Città</label>
            <input type="text" th:field="*{citta}" class="form-control">
          </div>
          <div class="col-md-1">
            <label class="form-label">Prov.</label>
            <input type="text" th:field="*{provincia}" class="form-control" maxlength="2">
          </div>
          <div class="col-md-4">
            <label class="form-label">Telefono</label>
            <input type="tel" th:field="*{telefono}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">PEC</label>
            <input type="email" th:field="*{pec}" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Note</label>
            <textarea th:field="*{note}" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-floppy me-1"></i>Salva
      </button>
      <a href="/clienti" class="btn btn-outline-secondary">Annulla</a>
    </div>
  </form>
</section>
</body>
</html>
