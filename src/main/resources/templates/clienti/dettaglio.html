<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Dettaglio cliente</title></head>
<body>
<section>
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-800" th:text="${cliente.displayName}"></h2>
    <div class="flex gap-3">
      <a href="/clienti" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
        <i class="bi bi-arrow-left me-2"></i>Torna alla lista
      </a>
      <a th:href="@{/clienti/{id}/modifica(id=${cliente.id})}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
        <i class="bi bi-pencil me-2"></i>Modifica Dati
      </a>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
        <h3 class="font-semibold text-slate-800 flex items-center">
          <i class="bi bi-person text-indigo-500 me-2 text-lg"></i>Dati Anagrafici
        </h3>
      </div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Tipo</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.tipo}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Ragione Sociale</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.ragioneSociale}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Codice Fiscale</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.codiceFiscale ?: '—'}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Partita IVA</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.partitaIva ?: '—'}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Codice SDI</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.codiceSdi ?: '—'}"></div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
        <h3 class="font-semibold text-slate-800 flex items-center">
          <i class="bi bi-geo-alt text-indigo-500 me-2 text-lg"></i>Recapiti e Contatti
        </h3>
      </div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Indirizzo</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.indirizzo != null ? cliente.indirizzo + ', ' + (cliente.cap ?: '') + ' ' + (cliente.citta ?: '') + ' (' + (cliente.provincia ?: '') + ')' : '—'}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Telefono</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.telefono ?: '—'}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Email</div>
          <div class="col-span-2 font-medium text-indigo-600">
            <a th:if="${cliente.email != null}" th:href="'mailto:' + ${cliente.email}" class="hover:underline" th:text="${cliente.email}"></a>
            <span th:if="${cliente.email == null}" class="text-slate-900">—</span>
          </div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">PEC</div>
          <div class="col-span-2 font-medium text-slate-900" th:text="${cliente.pec ?: '—'}"></div>
        </div>
        <div class="grid grid-cols-3">
          <div class="text-sm text-slate-500">Note</div>
          <div class="col-span-2 text-sm text-slate-700" th:text="${cliente.note ?: '—'}"></div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
