<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Anagrafica Articolo', ~{::section})}">
<body>
<section>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800" th:text="${articolo.id == null} ? 'Nuovo Articolo' : 'Modifica Articolo'"></h2>
    </div>

    <form method="post" action="/articoli/salva" th:object="${articolo}" class="max-w-4xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-box-seam text-indigo-500 me-2"></i>Dettagli Prodotto/Servizio</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Codice *</label>
                    <input type="text" th:field="*{codice}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500 font-mono uppercase">
                </div>

                <div class="md:col-span-9">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Descrizione *</label>
                    <input type="text" th:field="*{descrizione}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Unità di Misura</label>
                    <select th:field="*{unitaMisura}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="PZ">Pezzi (PZ)</option>
                        <option value="KG">Chilogrammi (KG)</option>
                        <option value="LT">Litri (LT)</option>
                        <option value="ORE">Ore (ORE)</option>
                        <option value="FORFAIT">A Forfait</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Giacenza Magazzino</label>
                    <input type="number" th:field="*{giacenza}" step="0.001" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Prezzo Base €</label>
                    <input type="number" th:field="*{prezzoBase}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Aliquota IVA %</label>
                    <input type="number" th:field="*{aliquotaIva}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="md:col-span-12">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Note interne</label>
                    <textarea th:field="*{note}" rows="3" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
            </div>
        </div>

        <div class="flex gap-4">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-lg shadow-sm transition-colors flex items-center">
                <i class="bi bi-floppy me-2"></i>Salva Articolo
            </button>
            <a href="/articoli" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-8 rounded-lg shadow-sm transition-colors text-center">
                Annulla
            </a>
        </div>
    </form>
</section>
</body>
</html>
