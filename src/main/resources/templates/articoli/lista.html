<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Catalogo e Magazzino', ~{::section})}">
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Catalogo e Magazzino</h2>
        <a href="/articoli/nuovo" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>Nuovo Articolo
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 font-medium">Codice</th>
                    <th class="px-6 py-4 font-medium w-1/3">Descrizione</th>
                    <th class="px-6 py-4 font-medium text-center">Giacenza</th>
                    <th class="px-6 py-4 font-medium text-right">Prezzo Base</th>
                    <th class="px-6 py-4 font-medium text-right">Azioni</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="a : ${articoli}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 bg-slate-100 text-slate-700 border border-slate-200 rounded-md text-xs font-bold font-mono" th:text="${a.codice}"></span>
                    </td>
                    <td class="px-6 py-4 font-medium text-slate-800" th:text="${a.descrizione}"></td>

                    <td class="px-6 py-4 text-center">
                        <span class="px-3 py-1 rounded-full text-sm font-bold border"
                              th:classappend="${a.giacenza <= 5} ? 'bg-rose-100 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'"
                              th:text="${a.giacenza + ' ' + a.unitaMisura}"></span>
                    </td>

                    <td class="px-6 py-4 text-right font-medium text-slate-900">
                        € <span th:text="${a.prezzoBase != null ? #numbers.formatDecimal(a.prezzoBase,1,'COMMA',2,'POINT') : '0,00'}"></span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <a th:href="@{/articoli/{id}/modifica(id=${a.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/articoli/{id}/elimina(id=${a.id})}" class="inline-block" onsubmit="return confirm('Disattivare questo articolo dal catalogo?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="inline-flex items-center justify-center w-8 h-8 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Elimina">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(articoli)}">
                    <td colspan="5" class="px-6 py-12 text-center text-slate-500">Nessun articolo a catalogo.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
