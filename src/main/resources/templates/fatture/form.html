<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Fattura</title></head>
<body>
<section>
  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-2xl font-bold text-slate-800" th:text="${fattura.id == null} ? 'Nuova Fattura ' + (${fattura.tipo?.name() == 'ATTIVA'} ? 'Attiva' : 'Passiva') : 'Modifica Fattura n.' + ${fattura.numero}"></h2>
    <a href="/fatture" class="text-slate-500 hover:text-slate-700 transition-colors flex items-center">
      <i class="bi bi-arrow-left me-1"></i>Torna alla lista
    </a>
  </div>

  <form method="post" action="/fatture/salva" th:object="${fattura}" class="max-w-5xl space-y-6">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
        <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-file-earmark-text text-indigo-500 me-2"></i>Intestazione Documento</h3>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Numero *</label>
          <input type="text" th:field="*{numero}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Anno *</label>
          <input type="number" th:field="*{anno}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Tipo</label>
          <input type="text" th:field="*{tipo}" readonly class="w-full border border-slate-200 bg-slate-100 rounded-lg px-4 py-2 text-slate-600 font-medium cursor-not-allowed">
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Data emissione *</label>
          <input type="date" th:field="*{dataEmissione}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Data scadenza</label>
          <input type="date" th:field="*{dataScadenza}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="md:col-span-6" th:if="${fattura.tipo?.name() == 'ATTIVA'}">
          <label class="block text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-2">Cliente Destinatario *</label>
          <select name="clienteId" class="w-full border border-indigo-300 bg-indigo-50 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500" required>
            <option value="">— Seleziona cliente —</option>
            <option th:each="c : ${clienti}" th:value="${c.id}" th:text="${c.displayName}" th:selected="${fattura.cliente != null && fattura.cliente.id == c.id}"></option>
          </select>
        </div>

        <div class="md:col-span-6" th:if="${fattura.tipo?.name() == 'PASSIVA'}">
          <label class="block text-xs font-semibold text-orange-600 uppercase tracking-wide mb-2">Fornitore Mittente *</label>
          <select name="fornitoreId" class="w-full border border-orange-300 bg-orange-50 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-orange-500" required>
            <option value="">— Seleziona fornitore —</option>
            <option th:each="f : ${fornitori}" th:value="${f.id}" th:text="${f.ragioneSociale}" th:selected="${fattura.fornitore != null && fattura.fornitore.id == f.id}"></option>
          </select>
        </div>

        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Metodo Pagamento</label>
          <select th:field="*{metodoPagamento}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="">— Nessuno —</option>
            <option value="Bonifico">Bonifico Bancario</option>
            <option value="RID">Addebito SDD (RID)</option>
            <option value="Contanti">Contanti</option>
            <option value="Carta">Carta di Credito</option>
            <option value="Assegno">Assegno</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Stato Iniziale</label>
          <select th:field="*{stato}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white">
            <option th:each="s : ${stati}" th:value="${s}" th:text="${s}" th:selected="${fattura.stato == s}"></option>
          </select>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-calculator text-indigo-500 me-2"></i>Totali Documento</h3>
        <span class="text-xs text-slate-500 italic">Compila se non usi le righe di dettaglio</span>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Aliquota IVA %</label>
          <input type="number" th:field="*{aliquotaIva}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Imponibile €</label>
          <input type="number" th:field="*{imponibile}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Totale IVA €</label>
          <input type="number" th:field="*{iva}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Totale Documento €</label>
          <input type="number" th:field="*{totale}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-indigo-700 font-bold bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-12">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Note Documento</label>
          <textarea th:field="*{note}" rows="2" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>
    </div>

    <div class="flex gap-4 pt-4">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-lg shadow-sm transition-colors flex items-center">
        <i class="bi bi-floppy me-2"></i>Salva Testata Fattura
      </button>
      <a href="/fatture" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-8 rounded-lg shadow-sm transition-colors text-center">
        Annulla
      </a>
    </div>
  </form>
</section>
</body>
</html>
