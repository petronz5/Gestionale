<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Fatture</title></head>
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Fatture <span class="text-slate-500 font-normal ml-2" th:text="${anno}"></span></h2>
        <div class="flex gap-3">
            <a href="/fatture/nuova?tipo=ATTIVA" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Fattura Attiva
            </a>
            <a href="/fatture/nuova?tipo=PASSIVA" class="bg-white border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Fattura Passiva
            </a>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
            <div>
                <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Fatturato <span th:text="${anno}"></span></div>
                <div class="text-3xl font-bold text-emerald-600">
                    € <span th:text="${totFatturato != null ? #numbers.formatDecimal(totFatturato,1,'COMMA',2,'POINT') : '0,00'}"></span>
                </div>
            </div>
            <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500 text-2xl"><i class="bi bi-graph-up-arrow"></i></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
            <div>
                <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Costi <span th:text="${anno}"></span></div>
                <div class="text-3xl font-bold text-rose-600">
                    € <span th:text="${totCosti != null ? #numbers.formatDecimal(totCosti,1,'COMMA',2,'POINT') : '0,00'}"></span>
                </div>
            </div>
            <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500 text-2xl"><i class="bi bi-graph-down-arrow"></i></div>
        </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
        <form method="get" action="/fatture" class="flex flex-wrap gap-4 items-end">
            <input type="hidden" name="anno" th:value="${anno}"/>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Tipo</label>
                <select name="tipo" class="border border-slate-300 rounded-lg px-4 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white min-w-[150px]">
                    <option value="">Tutti i tipi</option>
                    <option th:each="t : ${tipi}" th:value="${t}" th:text="${t}" th:selected="${t.name() == filtroTipo}"></option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Stato</label>
                <select name="stato" class="border border-slate-300 rounded-lg px-4 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white min-w-[150px]">
                    <option value="">Tutti gli stati</option>
                    <option th:each="s : ${stati}" th:value="${s}" th:text="${s}" th:selected="${s.name() == filtroStato}"></option>
                </select>
            </div>
            <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm text-sm">
                <i class="bi bi-funnel me-2"></i>Applica Filtri
            </button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 font-medium">N°</th>
                    <th class="px-6 py-4 font-medium">Data</th>
                    <th class="px-6 py-4 font-medium">Tipo</th>
                    <th class="px-6 py-4 font-medium">Intestazione</th>
                    <th class="px-6 py-4 font-medium">Scadenza</th>
                    <th class="px-6 py-4 font-medium text-right">Totale</th>
                    <th class="px-6 py-4 font-medium">Stato</th>
                    <th class="px-6 py-4 font-medium text-right">Azioni</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="f : ${fatture}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-slate-800" th:text="${f.numero}"></td>
                    <td class="px-6 py-4 text-sm text-slate-600" th:text="${f.dataEmissione != null ? #temporals.format(f.dataEmissione,'dd/MM/yyyy') : '—'}"></td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-md text-xs font-bold border"
                              th:classappend="${f.tipo?.name() == 'ATTIVA'} ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-orange-50 text-orange-700 border-orange-200'"
                              th:text="${f.tipo}"></span>
                    </td>
                    <td class="px-6 py-4 font-medium text-slate-900" th:text="${f.intestazione}"></td>
                    <td class="px-6 py-4 text-sm text-slate-600" th:text="${f.dataScadenza != null ? #temporals.format(f.dataScadenza,'dd/MM/yyyy') : '—'}"></td>
                    <td class="px-6 py-4 text-right font-bold text-slate-900">
                        € <span th:text="${f.totale != null ? #numbers.formatDecimal(f.totale,1,'COMMA',2,'POINT') : '0,00'}"></span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-md text-xs font-semibold border"
                              th:classappend="${f.stato?.name() == 'PAGATA'} ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (${f.stato?.name() == 'SCADUTA'} ? 'bg-rose-50 text-rose-700 border-rose-200' : (${f.stato?.name() == 'ANNULLATA'} ? 'bg-slate-100 text-slate-600 border-slate-200' : 'bg-blue-50 text-blue-700 border-blue-200'))"
                              th:text="${f.stato}"></span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <a th:href="@{/fatture/{id}(id=${f.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors" title="Dettaglio">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/fatture/{id}/modifica(id=${f.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fatture)}">
                    <td colspan="8" class="px-6 py-12 text-center text-slate-500">Nessuna fattura trovata per i criteri di ricerca.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
