<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Catalogo Articoli</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Catalogo Articoli/Servizi</h2>
        <a href="/articoli/nuovo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuovo Articolo
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Codice</th>
                    <th>Descrizione</th>
                    <th>U.M.</th>
                    <th class="text-end">Prezzo Base</th>
                    <th class="text-end">IVA</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${articoli}">
                    <td><span class="badge bg-secondary" th:text="${a.codice}"></span></td>
                    <td class="fw-semibold" th:text="${a.descrizione}"></td>
                    <td th:text="${a.unitaMisura}"></td>
                    <td class="text-end">€ <span th:text="${#numbers.formatDecimal(a.prezzoBase,1,'COMMA',2,'POINT')}"></span></td>
                    <td class="text-end" th:text="${a.aliquotaIva + '%'}"></td>
                    <td class="text-end">
                        <a th:href="@{/articoli/{id}/modifica(id=${a.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/articoli/{id}/elimina(id=${a.id})}" style="display:inline" onsubmit="return confirm('Disattivare articolo?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger ms-1"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(articoli)}">
                    <td colspan="6" class="text-center text-muted py-4">Nessun articolo a catalogo.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
