<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>DDT</title></head>
<body>
<section>
    <h2 class="mb-4" th:text="${ddt.id == null} ? 'Nuovo Documento di Trasporto' : 'Modifica DDT n.' + ${ddt.numero}"></h2>

    <form method="post" action="/ddt/salva">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{stato}"/>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">Riferimenti Documento</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label text-muted small text-uppercase">Numero *</label>
                        <input type="text" th:field="*{numero}" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small text-uppercase">Anno *</label>
                        <input type="number" th:field="*{anno}" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase">Data Documento *</label>
                        <input type="date" th:field="*{dataDocumento}" class="form-control" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label text-muted small text-uppercase">Cliente Destinatario *</label>
                        <select name="clienteId" class="form-select" required>
                            <option value="">— Seleziona cliente —</option>
                            <option th:each="c : ${clienti}" th:value="${c.id}" th:text="${c.displayName}" th:selected="${ddt.cliente != null && ddt.cliente.id == c.id}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">Dettagli Trasporto</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Causale Trasporto</label>
                        <input type="text" th:field="*{causaleTrasporto}" class="form-control" placeholder="es. Vendita, Reso, Conto Visione...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Aspetto dei Beni</label>
                        <input type="text" th:field="*{aspettoBeni}" class="form-control" placeholder="es. Scatole, Bancali...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small text-uppercase">Numero Colli</label>
                        <input type="number" th:field="*{numeroColli}" class="form-control" min="1">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label text-muted small text-uppercase">Vettore / Trasportatore</label>
                        <input type="text" th:field="*{vettore}" class="form-control" placeholder="Nome del corriere o Mittente">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-floppy me-2"></i>Salva Testata DDT</button>
            <a href="/ddt" class="btn btn-outline-secondary px-4">Annulla</a>
        </div>
    </form>
</section>
</body>
</html>
