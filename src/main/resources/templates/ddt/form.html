<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Nuovo DDT', ~{::section})}">
<body>
<section>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800" th:text="${ddt.id == null} ? 'Nuovo Documento di Trasporto' : 'Modifica DDT n.' + ${ddt.numero}"></h2>
    </div>

    <form method="post" action="/ddt/salva" th:object="${ddt}" class="max-w-5xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{stato}"/>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-file-earmark-text text-indigo-500 me-2"></i>Riferimenti Documento</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Numero *</label>
                    <input type="text" th:field="*{numero}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Anno *</label>
                    <input type="number" th:field="*{anno}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Data Documento *</label>
                    <input type="date" th:field="*{dataDocumento}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-5">
                    <label class="block text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-2">Cliente Destinatario *</label>
                    <select name="clienteId" required class="w-full border border-indigo-300 bg-indigo-50 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                        <option value="">— Seleziona cliente —</option>
                        <option th:each="c : ${clienti}" th:value="${c.id}" th:text="${c.displayName}" th:selected="${ddt.cliente != null && ddt.cliente.id == c.id}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-truck text-indigo-500 me-2"></i>Dettagli Trasporto</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Causale Trasporto</label>
                    <input type="text" th:field="*{causaleTrasporto}" placeholder="es. Vendita, Reso..." class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Aspetto dei Beni</label>
                    <input type="text" th:field="*{aspettoBeni}" placeholder="es. Scatole, Bancali..." class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Numero Colli</label>
                    <input type="number" th:field="*{numeroColli}" min="1" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-12">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Vettore / Trasportatore</label>
                    <input type="text" th:field="*{vettore}" placeholder="Nome del corriere o Mittente" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>

        <div class="flex gap-4 pt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-lg shadow-sm transition-colors flex items-center">
                <i class="bi bi-floppy me-2"></i>Salva Testata DDT
            </button>
            <a href="/ddt" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-8 rounded-lg shadow-sm transition-colors text-center">
                Annulla
            </a>
        </div>
    </form>
</section>
</body>
</html>
