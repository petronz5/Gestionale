<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Dettaglio DDT</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>DDT n. <span th:text="${ddt.numero}"></span> / <span th:text="${ddt.anno}"></span></h2>
        <div class="d-flex gap-2">
            <a th:href="@{/ddt/{id}/modifica(id=${ddt.id})}" class="btn btn-outline-primary">
                <i class="bi bi-pencil me-1"></i>Modifica Testata
            </a>
            <a href="/ddt" class="btn btn-outline-secondary">← Torna alla lista</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4 bg-light">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <div class="text-muted small text-uppercase">Data</div>
                    <div class="fw-semibold fs-5" th:text="${#temporals.format(ddt.dataDocumento,'dd/MM/yyyy')}"></div>
                </div>
                <div class="col-md-5">
                    <div class="text-muted small text-uppercase">Destinatario</div>
                    <div class="fw-semibold fs-5" th:text="${ddt.cliente.displayName}"></div>
                </div>
                <div class="col-md-2">
                    <div class="text-muted small text-uppercase">Colli</div>
                    <div class="fw-semibold fs-5" th:text="${ddt.numeroColli}"></div>
                </div>
                <div class="col-md-2 text-end">
                    <div class="text-muted small text-uppercase">Stato</div>
                    <span class="badge" th:classappend="${ddt.stato.name() == 'DA_FATTURARE'} ? 'bg-warning text-dark' : 'bg-success'" th:text="${ddt.stato}"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4" th:if="${ddt.stato.name() == 'DA_FATTURARE'}">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-plus-circle me-2 text-primary"></i>Aggiungi Articolo</div>
        <div class="card-body bg-light">
            <form method="post" th:action="@{/ddt/{id}/righe(id=${ddt.id})}" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="col-md-6">
                    <label class="form-label small">Seleziona dal Catalogo</label>
                    <select name="articoloId" class="form-select">
                        <option value="">— Descrizione Libera —</option>
                        <option th:each="a : ${articoli}" th:value="${a.id}" th:text="${a.codice + ' - ' + a.descrizione}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Oppure inserisci descrizione libera</label>
                    <input type="text" name="descrizione" class="form-control" placeholder="Es. Materiale di consumo...">
                </div>
                <div class="col-md-1">
                    <label class="form-label small">Q.tà *</label>
                    <input type="number" name="quantita" class="form-control" value="1" min="0.001" step="0.001" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>Codice Art.</th>
                    <th>Descrizione</th>
                    <th class="text-end">Quantità</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="riga, iter : ${ddt.righe}">
                    <td th:text="${iter.count}"></td>
                    <td><span th:if="${riga.articolo != null}" class="badge bg-secondary" th:text="${riga.articolo.codice}"></span></td>
                    <td class="fw-semibold" th:text="${riga.descrizione}"></td>
                    <td class="text-end fw-bold" th:text="${riga.quantita}"></td>
                    <td class="text-end">
                        <form method="post" th:action="@{/ddt/righe/{rigaId}/elimina(rigaId=${riga.id})}" style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="ddtId" th:value="${ddt.id}"/>
                            <button class="btn btn-sm btn-outline-danger" th:disabled="${ddt.stato.name() != 'DA_FATTURARE'}"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ddt.righe)}">
                    <td colspan="5" class="text-center text-muted py-4">Nessun articolo inserito nel documento.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
