<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Dettaglio DDT</title></head>
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">DDT n. <span th:text="${ddt.numero}" class="text-indigo-600"></span> / <span th:text="${ddt.anno}"></span></h2>
        <div class="flex gap-3">
            <a href="/ddt" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Torna alla lista
            </a>
            <a th:href="@{/ddt/{id}/modifica(id=${ddt.id})}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
                <i class="bi bi-pencil me-2"></i>Modifica Testata
            </a>
        </div>
    </div>

    <div class="bg-slate-800 text-white rounded-xl shadow-sm mb-6 p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div>
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Data</div>
                <div class="text-xl font-medium" th:text="${ddt.dataDocumento != null ? #temporals.format(ddt.dataDocumento,'dd/MM/yyyy') : '—'}"></div>
            </div>
            <div class="md:col-span-2">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Destinatario</div>
                <div class="text-xl font-medium text-indigo-300" th:text="${ddt.cliente?.displayName}"></div>
            </div>
            <div class="text-right">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Stato & Colli</div>
                <div class="flex items-center justify-end gap-3 mt-1">
                    <span class="text-lg font-bold" th:text="${ddt.numeroColli} + ' Colli'"></span>
                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"
                          th:classappend="${ddt.stato?.name() == 'DA_FATTURARE'} ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'"
                          th:text="${ddt.stato}"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-indigo-50 border border-indigo-100 rounded-xl shadow-sm mb-6 overflow-hidden" th:if="${ddt.stato?.name() == 'DA_FATTURARE'}">
        <div class="px-6 py-4 border-b border-indigo-100 bg-indigo-100/50">
            <h3 class="font-bold text-indigo-900 flex items-center"><i class="bi bi-plus-circle me-2"></i>Aggiungi Articolo al Documento</h3>
        </div>
        <div class="p-6">
            <form method="post" th:action="@{/ddt/{id}/righe(id=${ddt.id})}" class="flex flex-col md:flex-row gap-4 items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="flex-1 w-full">
                    <label class="block text-xs font-semibold text-indigo-800 uppercase mb-1">Catalogo</label>
                    <select name="articoloId" class="w-full border border-indigo-200 rounded-lg px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">— Nessuno (Descr. Libera) —</option>
                        <option th:each="a : ${articoli}" th:value="${a.id}" th:text="${a.codice + ' - ' + a.descrizione}"></option>
                    </select>
                </div>
                <div class="flex-1 w-full">
                    <label class="block text-xs font-semibold text-indigo-800 uppercase mb-1">Descrizione Libera</label>
                    <input type="text" name="descrizione" class="w-full border border-indigo-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Scrivi qui se non usi il catalogo...">
                </div>
                <div class="w-full md:w-24">
                    <label class="block text-xs font-semibold text-indigo-800 uppercase mb-1">Q.tà *</label>
                    <input type="number" name="quantita" class="w-full border border-indigo-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="1" min="0.001" step="0.001" required>
                </div>
                <button type="submit" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium shadow-sm transition-colors">
                    Inserisci
                </button>
            </form>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
            <tr>
                <th class="px-6 py-4 font-medium w-16 text-center">#</th>
                <th class="px-6 py-4 font-medium">Cod. Articolo</th>
                <th class="px-6 py-4 font-medium w-1/2">Descrizione</th>
                <th class="px-6 py-4 font-medium text-center">Quantità</th>
                <th class="px-6 py-4 font-medium text-right">Azioni</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="riga, iter : ${ddt.righe}" class="hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4 text-center text-sm text-slate-400" th:text="${iter.count}"></td>
                <td class="px-6 py-4">
                    <span th:if="${riga.articolo != null}" class="px-2 py-1 bg-slate-100 border border-slate-200 text-slate-700 rounded text-xs font-mono" th:text="${riga.articolo.codice}"></span>
                </td>
                <td class="px-6 py-4 font-medium text-slate-800" th:text="${riga.descrizione}"></td>
                <td class="px-6 py-4 text-center text-lg font-bold text-indigo-600" th:text="${riga.quantita}"></td>
                <td class="px-6 py-4 text-right">
                    <form method="post" th:action="@{/ddt/righe/{rigaId}/elimina(rigaId=${riga.id})}" class="inline-block">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="ddtId" th:value="${ddt.id}"/>
                        <button th:disabled="${ddt.stato?.name() != 'DA_FATTURARE'}" class="inline-flex items-center justify-center w-8 h-8 rounded disabled:opacity-50 disabled:cursor-not-allowed bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Rimuovi riga">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ddt.righe)}">
                <td colspan="5" class="px-6 py-12 text-center text-slate-500">Documento vuoto. Aggiungi il primo articolo.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
