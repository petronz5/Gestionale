<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Documenti di Trasporto</title></head>
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">DDT <span class="text-slate-500 text-lg font-normal ml-2" th:text="${anno}"></span></h2>
        <a href="/ddt/nuovo" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>Nuovo DDT
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 font-medium">N°</th>
                    <th class="px-6 py-4 font-medium">Data</th>
                    <th class="px-6 py-4 font-medium">Cliente</th>
                    <th class="px-6 py-4 font-medium">Causale</th>
                    <th class="px-6 py-4 font-medium">Colli</th>
                    <th class="px-6 py-4 font-medium">Stato</th>
                    <th class="px-6 py-4 font-medium text-right">Azioni</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="d : ${ddts}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-slate-800" th:text="${d.numero}"></td>
                    <td class="px-6 py-4 text-sm text-slate-600" th:text="${d.dataDocumento != null ? #temporals.format(d.dataDocumento,'dd/MM/yyyy') : '—'}"></td>
                    <td class="px-6 py-4 text-sm font-medium text-indigo-600" th:text="${d.cliente?.displayName}"></td>
                    <td class="px-6 py-4 text-sm text-slate-600" th:text="${d.causaleTrasporto}"></td>
                    <td class="px-6 py-4 text-sm font-medium" th:text="${d.numeroColli}"></td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-md text-xs font-semibold"
                              th:classappend="${d.stato?.name() == 'DA_FATTURARE'} ? 'bg-amber-100 text-amber-800 border border-amber-200' : (${d.stato?.name() == 'FATTURATO'} ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-slate-200')"
                              th:text="${d.stato}"></span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <a th:href="@{/ddt/{id}/modifica(id=${d.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/ddt/{id}/elimina(id=${d.id})}" class="inline-block" onsubmit="return confirm('Annullare questo DDT?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button th:disabled="${d.stato?.name() != 'DA_FATTURARE'}" class="inline-flex items-center justify-center w-8 h-8 rounded disabled:opacity-50 disabled:cursor-not-allowed bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Annulla">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ddts)}">
                    <td colspan="7" class="px-6 py-12 text-center text-slate-500">Nessun DDT trovato per quest'anno.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
