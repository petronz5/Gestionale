<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Documenti di Trasporto</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Documenti di Trasporto (DDT) <span class="text-muted fs-5" th:text="${anno}"></span></h2>
        <a href="/ddt/nuovo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuovo DDT
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>N°</th>
                    <th>Data</th>
                    <th>Cliente</th>
                    <th>Causale</th>
                    <th>Colli</th>
                    <th>Stato</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${ddts}">
                    <td class="fw-semibold" th:text="${d.numero}"></td>
                    <td th:text="${#temporals.format(d.dataDocumento,'dd/MM/yyyy')}"></td>
                    <td th:text="${d.cliente.displayName}"></td>
                    <td th:text="${d.causaleTrasporto}"></td>
                    <td th:text="${d.numeroColli}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${d.stato.name() == 'DA_FATTURARE'} ? 'bg-warning text-dark' : (${d.stato.name() == 'FATTURATO'} ? 'bg-success' : 'bg-secondary')"
                              th:text="${d.stato}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/ddt/{id}/modifica(id=${d.id})}" class="btn btn-sm btn-outline-primary" title="Modifica Testata">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/ddt/{id}/elimina(id=${d.id})}" style="display:inline" onsubmit="return confirm('Annullare questo DDT?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger ms-1" th:disabled="${d.stato.name() != 'DA_FATTURARE'}">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ddts)}">
                    <td colspan="7" class="text-center text-muted py-4">Nessun DDT trovato per quest'anno.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
