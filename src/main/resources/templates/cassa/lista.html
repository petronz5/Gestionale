<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Prima Nota', ~{::section})}">
<body>
<section>
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Prima Nota e Cassa</h2>
      <p class="text-slate-500 text-sm mt-1">Traccia la liquidità aziendale, entrate e uscite di cassa.</p>
    </div>
    <div class="bg-white px-6 py-4 rounded-xl shadow-sm border border-slate-200 min-w-[200px]">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Saldo di Cassa Attuale</span>
      <span class="text-2xl font-black mt-1 block" th:classappend="${saldo >= 0} ? 'text-emerald-600' : 'text-rose-600'" th:text="'€ ' + #numbers.formatDecimal(saldo,1,'COMMA',2,'POINT')"></span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
          <tr>
            <th class="px-4 py-3 font-medium">Data</th>
            <th class="px-4 py-3 font-medium">Descrizione</th>
            <th class="px-4 py-3 font-medium">Metodo</th>
            <th class="px-4 py-3 font-medium text-right">Importo</th>
            <th class="px-4 py-3 font-medium text-right">Azioni</th>
          </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-sm">
          <tr th:each="m : ${movimenti}" class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-600" th:text="${#temporals.format(m.dataMovimento,'dd/MM/yyyy')}"></td>
            <td class="px-4 py-3 text-slate-800 font-medium" th:text="${m.descrizione}"></td>

            <td class="px-4 py-3">
              <span class="px-2 py-0.5 bg-slate-100 border rounded text-xs font-semibold text-slate-600" th:text="${m.metodoPagamento}"></span>
            </td>

            <td class="px-4 py-3 text-right font-bold whitespace-nowrap"
                th:classappend="${m.tipo.name() == 'ENTRATA'} ? 'text-emerald-600' : 'text-rose-600'"
                th:text="${(m.tipo.name() == 'ENTRATA' ? '+ € ' : '- € ') + #numbers.formatDecimal(m.importo,1,'COMMA',2,'POINT')}">
            </td>

            <td class="px-4 py-3 text-right">
              <form method="post" th:action="@{/cassa/{id}/elimina(id=${m.id})}" class="inline-block" onsubmit="return confirm('Eliminare questo movimento?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="text-slate-400 hover:text-rose-600 p-1 transition-colors"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(movimenti)}">
            <td colspan="5" class="px-4 py-12 text-center text-slate-400">Nessun movimento registrato in cassa.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-5 h-fit">
      <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4 pb-2 border-b border-slate-100">Registra Movimento</h3>
      <form method="post" action="/cassa/salva" th:object="${movimento}" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tipo Flusso</label>
          <select th:field="*{tipo}" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ENTRATA">🟢 ENTRATA (Incasso)</option>
            <option value="USCITA">🔴 USCITA (Spesa)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Data *</label>
          <input type="date" th:field="*{dataMovimento}" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Descrizione / Causale *</label>
          <input type="text" th:field="*{descrizione}" required placeholder="es. Incasso corrispettivi, Pagamento Affitto..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Importo * (€)</label>
          <input type="number" th:field="*{importo}" step="0.01" required min="0.01" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Metodo di Pagamento</label>
          <select th:field="*{metodoPagamento}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="BONIFICO">BONIFICO</option>
            <option value="CONTANTI">CONTANTI</option>
            <option value="CARTA/BANCOMAT">CARTA/BANCOMAT</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center">
          <i class="bi bi-plus-lg me-2"></i>Aggiungi a Prima Nota
        </button>
      </form>
    </div>
  </div>
</section>
