<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Gestionale'">Gestionale</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-briefcase-fill me-2"></i>Gestionale
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/clienti">
                        <i class="bi bi-people me-1"></i>Clienti
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/fornitori">
                        <i class="bi bi-truck me-1"></i>Fornitori
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/fatture">
                        <i class="bi bi-receipt me-1"></i>Fatture
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/fatturazione-differita">
                        <i class="bi bi-magic me-1"></i>Fatturazione Differita
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/scadenze">
                        <i class="bi bi-calendar-event me-1"></i>Scadenzario
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/articoli">
                        <i class="bi bi-box-seam me-1"></i>Articoli
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ddt">
                        <i class="bi bi-truck-flatbed me-1"></i>DDT
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" href="/utenti">
                        <i class="bi bi-shield-lock me-1"></i>Gestione Utenti
                    </a>
                </li>

            </ul>

            <form method="post" action="/logout" class="d-flex">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Esci
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Contenuto -->
<div class="container-fluid py-4 px-4">
    <div th:if="${successo}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successo}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:replace="${content}"><!-- pagina --></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
