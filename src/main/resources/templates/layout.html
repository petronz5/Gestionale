<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Gestionale'">Gestionale</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
<div class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 shrink-0">
        <div class="h-16 flex items-center px-6 bg-slate-950 text-white font-bold text-xl tracking-tight">
            <i class="bi bi-briefcase-fill me-3 text-indigo-500"></i>Gestionale
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="/dashboard" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-speedometer2 w-6 text-center me-2 text-lg"></i>Dashboard
            </a>
            <a href="/clienti" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-people w-6 text-center me-2 text-lg"></i>Clienti
            </a>
            <a href="/fornitori" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-truck w-6 text-center me-2 text-lg"></i>Fornitori
            </a>

            <div class="pt-4 pb-1">
                <span class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Fatturazione</span>
            </div>
            <a href="/fatture" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-receipt w-6 text-center me-2 text-lg"></i>Fatture
            </a>
            <a href="/fatture?tipo=PREVENTIVO" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-file-earmark-text w-6 text-center me-2 text-lg"></i>Lista Preventivi
            </a>
            <a href="/fatture/nuova?tipo=PREVENTIVO" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-emerald-400 hover:text-emerald-300 transition-colors border border-slate-700 border-dashed">
                <i class="bi bi-file-earmark-plus w-6 text-center me-2 text-lg"></i>Crea Preventivo
            </a>
            <a href="/fatturazione-differita" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors mt-1">
                <i class="bi bi-magic w-6 text-center me-2 text-lg"></i>Fatt. Differita
            </a>

            <div class="pt-4 pb-1">
                <span class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Gestione</span>
            </div>
            <a href="/scadenze" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-calendar-event w-6 text-center me-2 text-lg"></i>Scadenzario
            </a>

            <a href="/cassa" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-cash-coin w-6 text-center me-2 text-lg"></i>Prima Nota / Cassa
            </a>

            <a href="/articoli" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-box-seam w-6 text-center me-2 text-lg"></i>Articoli & Magazzino
            </a>
            <a href="/ddt" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i class="bi bi-truck-flatbed w-6 text-center me-2 text-lg"></i>DDT
            </a>

            <a sec:authorize="hasRole('ADMIN')" href="/utenti" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-amber-400 hover:text-amber-300 transition-colors mt-4">
                <i class="bi bi-shield-lock w-6 text-center me-2 text-lg"></i>Gestione Utenti
            </a>
        </nav>
        <div class="p-4 bg-slate-950">
            <form method="post" action="/logout">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <a href="/impostazioni" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors mb-2 text-slate-400 block">
                    <i class="bi bi-gear w-6 text-center me-2 text-lg"></i>Impostazioni Azienda
                </a>
                <button type="submit" class="w-full flex items-center justify-center px-4 py-2 border border-slate-700 hover:bg-slate-800 text-white rounded-lg transition-colors text-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Esci dal sistema
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative bg-slate-50">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h1 class="text-xl font-semibold text-slate-800" th:text="${title}">Titolo</h1>
            <div class="flex items-center gap-3 text-sm text-slate-500">
                <i class="bi bi-person-circle text-xl"></i>
                <span sec:authentication="name">Utente</span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div th:if="${successo}" class="mb-6 px-4 py-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 flex items-center justify-between shadow-sm">
                <div class="flex items-center">
                    <i class="bi bi-check-circle-fill me-2 text-lg"></i>
                    <span th:text="${successo}"></span>
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-700"><i class="bi bi-x-lg"></i></button>
            </div>

            <div th:if="${errore}" class="mb-6 px-4 py-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 flex items-center justify-between shadow-sm">
                <div class="flex items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 text-lg"></i>
                    <span th:text="${errore}"></span>
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 hover:text-rose-700"><i class="bi bi-x-lg"></i></button>
            </div>

            <div th:replace="${content}"></div>
        </div>
    </main>
</div>
</body>
</html>
