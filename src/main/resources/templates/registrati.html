<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crea Account Aziendale — SaaS</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-slate-100 font-sans antialiased flex items-center justify-center min-h-screen py-12 px-4">

<div class="w-full max-w-2xl p-8 bg-white rounded-2xl shadow-xl border border-slate-200">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 mb-3">
      <i class="bi bi-rocket-takeoff text-2xl"></i>
    </div>
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Attiva il tuo Gestionale SaaS</h2>
    <p class="text-slate-500 text-sm mt-1">Crea l'istanza per la tua azienda in pochi secondi.</p>
  </div>

  <div th:if="${errore}" class="mb-6 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium">
    <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${errore}"></span>
  </div>

  <form method="post" action="/registrati" class="space-y-6">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="border-b border-slate-100 pb-5">
      <h3 class="text-sm font-semibold text-indigo-600 uppercase tracking-wider mb-4">1. Dati della tua Azienda</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Partita IVA Aziendale</label>
          <div class="flex gap-2">
            <input type="text" id="partitaIvaInput" name="partitaIva" required maxlength="11" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
            <button type="button" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 rounded-lg text-sm transition-colors border border-indigo-200 whitespace-nowrap" onclick="cercaPartitaIva()">
              <i class="bi bi-search me-1"></i> Cerca
            </button>
          </div>
          <div id="apiStatus" class="text-xs mt-1"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Ragione Sociale *</label>
          <input type="text" id="ragioneSociale" name="ragioneSociale" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-slate-700 mb-1">Indirizzo Sede Legale</label>
          <input type="text" id="indirizzo" name="indirizzo" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-3 md:col-span-2 gap-3">
          <div class="col-span-1">
            <label class="block text-xs font-medium text-slate-700 mb-1">CAP</label>
            <input type="text" id="cap" name="cap" maxlength="5" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-medium text-slate-700 mb-1">Città</label>
            <input type="text" id="citta" name="citta" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-medium text-slate-700 mb-1">Provincia</label>
            <input type="text" id="provincia" name="provincia" maxlength="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 text-center uppercase focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
      </div>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-indigo-600 uppercase tracking-wider mb-4">2. Credenziali Primo Utente (Admin)</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Username Acceso *</label>
          <input type="text" name="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Email Personale/Aziendale *</label>
          <input type="email" name="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Scegli una Password *</label>
          <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
      <a href="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Hai già un account aziendale? Accedi</a>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-3 px-6 rounded-lg transition-colors shadow-sm">
        Attiva Abbonamento & Entra
      </button>
    </div>
  </form>
</div>

<script>
  function cercaPartitaIva() {
    const piva = document.getElementById('partitaIvaInput').value;
    const status = document.getElementById('apiStatus');
    if(piva.length !== 11) {
      status.innerHTML = "<span class='text-rose-500 font-medium'>La P.IVA deve essere di 11 cifre</span>";
      return;
    }
    status.innerHTML = "<span class='text-indigo-600 font-medium'><i class='bi bi-hourglass-split animate-spin me-1'></i> Recupero dati dal Registro Imprese...</span>";

    fetch('/api/integrazioni/piva/' + piva)
            .then(response => {
              if(!response.ok) throw new Error("Azienda non trovata");
              return response.json();
            })
            .then(data => {
              document.getElementById('ragioneSociale').value = data.ragioneSociale || '';
              document.getElementById('indirizzo').value = data.indirizzo || '';
              document.getElementById('cap').value = data.cap || '';
              document.getElementById('citta').value = data.citta || '';
              document.getElementById('provincia').value = data.provincia || '';
              status.innerHTML = "<span class='text-emerald-600 font-medium'><i class='bi bi-check-circle-fill me-1'></i> Dati Aziendali compilati!</span>";
            })
            .catch(error => {
              status.innerHTML = "<span class='text-rose-500 font-medium'><i class='bi bi-x-circle-fill me-1'></i> Impossibile autocompilare. Scrivi a mano.</span>";
            });
  }
</script>
</body>
</html>
