<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Utente</title></head>
<body>
<section>
    <h2 class="mb-4" th:text="${utente.id == null} ? 'Crea Nuovo Utente' : 'Modifica Utente'"></h2>

    <form method="post" action="/utenti/salva" th:object="${utente}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{attivo}"/>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">Dati di Accesso</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small text-uppercase">Username *</label>
                        <input type="text" th:field="*{username}" class="form-control" required autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small text-uppercase">Password <span th:if="${utente.id == null}">*</span></label>
                        <input type="password" th:field="*{password}" class="form-control"
                               th:placeholder="${utente.id != null ? 'Lascia vuoto per non modificare' : 'Scegli una password'}"
                               th:required="${utente.id == null}" autocomplete="new-password">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Ruolo Operativo *</label>
                        <select th:field="*{ruolo}" class="form-select" required>
                            <option value="ADMIN">Amministratore Totale</option>
                            <option value="USER">Impiegato (Limitato)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">Dati Anagrafici</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Cognome</label>
                        <input type="text" th:field="*{cognome}" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small text-uppercase">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-floppy me-2"></i>Salva Utente</button>
            <a href="/utenti" class="btn btn-outline-secondary px-4">Annulla</a>
        </div>
    </form>
</section>
</body>
</html>
