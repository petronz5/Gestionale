<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Profilo Utente', ~{::section})}">
<body>
<section>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800" th:text="${utente.id == null} ? 'Crea Nuovo Utente' : 'Modifica Utente'"></h2>
    </div>

    <form method="post" action="/utenti/salva" th:object="${utente}" class="max-w-4xl space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{attivo}"/>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-shield-lock text-indigo-500 me-2"></i>Dati di Accesso</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-5">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Username *</label>
                    <input type="text" th:field="*{username}" required autocomplete="off" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Password <span th:if="${utente.id == null}">*</span></label>
                    <input type="password" th:field="*{password}"
                           th:placeholder="${utente.id != null ? 'Lascia vuoto per non modificare' : 'Scegli una password'}"
                           th:required="${utente.id == null}" autocomplete="new-password"
                           class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Ruolo *</label>
                    <select th:field="*{ruolo}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="ADMIN">Amministratore</option>
                        <option value="USER">Impiegato</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h3 class="font-semibold text-slate-800 flex items-center"><i class="bi bi-person-lines-fill text-indigo-500 me-2"></i>Dati Anagrafici</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Nome</label>
                    <input type="text" th:field="*{nome}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Cognome</label>
                    <input type="text" th:field="*{cognome}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Email</label>
                    <input type="email" th:field="*{email}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>

        <div class="flex gap-4">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-8 rounded-lg shadow-sm transition-colors flex items-center">
                <i class="bi bi-floppy me-2"></i>Salva Utente
            </button>
            <a href="/utenti" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium py-2 px-8 rounded-lg shadow-sm transition-colors text-center">
                Annulla
            </a>
        </div>
    </form>
</section>
</body>
</html>
