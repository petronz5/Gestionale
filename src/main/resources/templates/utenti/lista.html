<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Gestione Utenti</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Pannello Utenti Amministratori</h2>
        <a href="/utenti/nuovo" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i>Nuovo Utente
        </a>
    </div>

    <div th:if="${errore}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errore}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Username</th>
                    <th>Nome e Cognome</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${utenti}">
                    <td class="fw-semibold" th:text="${u.username}"></td>
                    <td th:text="${(u.nome ?: '') + ' ' + (u.cognome ?: '')}"></td>
                    <td th:text="${u.email ?: '—'}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${u.ruolo}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.attivo} ? 'bg-success' : 'bg-danger'"
                              th:text="${u.attivo ? 'ATTIVO' : 'BLOCCATO'}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/utenti/{id}/modifica(id=${u.id})}" class="btn btn-sm btn-outline-primary" title="Modifica Utente">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <form method="post" th:action="@{/utenti/{id}/toggle-stato(id=${u.id})}" style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm ms-1"
                                    th:classappend="${u.attivo} ? 'btn-outline-danger' : 'btn-success'"
                                    th:title="${u.attivo} ? 'Blocca Accesso' : 'Sblocca Accesso'">
                                <i class="bi" th:classappend="${u.attivo} ? 'bi-lock-fill' : 'bi-unlock-fill'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
