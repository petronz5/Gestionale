<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Gestione Utenti', ~{::section})}">
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Pannello Utenti Amministratori</h2>
        <a href="/utenti/nuovo" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
            <i class="bi bi-person-plus me-2"></i>Nuovo Utente
        </a>
    </div>

    <div th:if="${errore}" class="mb-6 px-4 py-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 flex items-center shadow-sm">
        <i class="bi bi-exclamation-triangle-fill me-2 text-lg"></i>
        <span th:text="${errore}"></span>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 font-medium">Username</th>
                    <th class="px-6 py-4 font-medium">Nome e Cognome</th>
                    <th class="px-6 py-4 font-medium">Email</th>
                    <th class="px-6 py-4 font-medium">Ruolo</th>
                    <th class="px-6 py-4 font-medium">Stato</th>
                    <th class="px-6 py-4 font-medium text-right">Azioni</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="u : ${utenti}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-slate-800" th:text="${u.username}"></td>
                    <td class="px-6 py-4 text-sm text-slate-700" th:text="${(u.nome ?: '') + ' ' + (u.cognome ?: '')}"></td>
                    <td class="px-6 py-4 text-sm text-slate-600" th:text="${u.email ?: '—'}"></td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 bg-slate-100 text-slate-600 border border-slate-200 rounded-md text-xs font-semibold" th:text="${u.ruolo}"></span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-md text-xs font-bold border"
                              th:classappend="${u.attivo} ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'"
                              th:text="${u.attivo ? 'ATTIVO' : 'BLOCCATO'}"></span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <a th:href="@{/utenti/{id}/modifica(id=${u.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica Utente">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/utenti/{id}/toggle-stato(id=${u.id})}" class="inline-block">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="inline-flex items-center justify-center w-8 h-8 rounded transition-colors"
                                    th:classappend="${u.attivo} ? 'bg-amber-50 text-amber-600 hover:bg-amber-100' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'"
                                    th:title="${u.attivo} ? 'Blocca Accesso' : 'Sblocca Accesso'">
                                <i class="bi" th:classappend="${u.attivo} ? 'bi-lock-fill' : 'bi-unlock-fill'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
