<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Gestione Scadenza', ~{::section})}">
<body>
<section>
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-800" th:text="${scadenza.id == null} ? 'Nuova scadenza' : 'Modifica scadenza'"></h2>
  </div>

  <form method="post" action="/scadenze/salva" th:object="${scadenza}" class="max-w-4xl">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6 p-6">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-8">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Titolo *</label>
          <input type="text" th:field="*{titolo}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-4">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Tipo</label>
          <select th:field="*{tipo}" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option th:each="t : ${tipi}" th:value="${t}" th:text="${t}"></option>
          </select>
        </div>
        <div class="md:col-span-4">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Data scadenza *</label>
          <input type="date" th:field="*{dataScadenza}" required class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-5">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Cliente (opzionale)</label>
          <select name="clienteId" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="">— Nessuno —</option>
            <option th:each="c : ${clienti}" th:value="${c.id}" th:text="${c.displayName}" th:selected="${scadenza.cliente != null && scadenza.cliente.id == c.id}"></option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Importo €</label>
          <input type="number" th:field="*{importo}" step="0.01" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-12">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Note</label>
          <textarea th:field="*{note}" rows="3" class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>
    </div>

    <div class="flex gap-4">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm inline-flex items-center">
        <i class="bi bi-floppy me-2"></i>Salva Scadenza
      </button>
      <a href="/scadenze" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium py-2 px-6 rounded-lg transition-colors shadow-sm text-center">
        Annulla
      </a>
    </div>
  </form>
</section>
</body>
</html>
