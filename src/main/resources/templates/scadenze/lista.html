<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Scadenzario', ~{::section})}">
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Scadenzario</h2>
        <a href="/scadenze/nuova" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg inline-flex items-center transition-colors shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>Nuova scadenza
        </a>
    </div>

    <div class="mb-6 flex gap-2 overflow-x-auto pb-2">
        <a th:each="s : ${stati}"
           th:href="@{/scadenze(stato=${s})}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors border"
           th:classappend="${s.name() == filtroStato} ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'"
           th:text="${s}"></a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 font-medium">Scadenza</th>
                    <th class="px-6 py-4 font-medium">Titolo</th>
                    <th class="px-6 py-4 font-medium">Tipo</th>
                    <th class="px-6 py-4 font-medium">Cliente</th>
                    <th class="px-6 py-4 font-medium text-right">Importo</th>
                    <th class="px-6 py-4 font-medium text-right">Azioni</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="s : ${scadenze}" class="transition-colors" th:classappend="${s.scaduta} ? 'bg-rose-50 hover:bg-rose-100' : 'hover:bg-slate-50'">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="font-medium" th:classappend="${s.scaduta} ? 'text-rose-700' : 'text-slate-900'" th:text="${s.dataScadenza != null ? #temporals.format(s.dataScadenza,'dd/MM/yyyy') : '—'}"></span>
                        <i th:if="${s.scaduta}" class="bi bi-exclamation-triangle-fill text-rose-500 ms-2" title="Scaduta"></i>
                    </td>
                    <td class="px-6 py-4 font-medium text-slate-800" th:text="${s.titolo}"></td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 bg-slate-100 text-slate-600 border border-slate-200 rounded-md text-xs font-semibold" th:text="${s.tipo}"></span>
                    </td>
                    <td class="px-6 py-4 text-sm text-indigo-600 font-medium" th:text="${s.cliente?.displayName ?: '—'}"></td>
                    <td class="px-6 py-4 text-right font-bold text-slate-900" th:text="${s.importo != null ? '€ ' + #numbers.formatDecimal(s.importo,1,'COMMA',2,'POINT') : '—'}"></td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <form method="post" th:action="@{/scadenze/{id}/completa(id=${s.id})}" class="inline-block">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button th:disabled="${s.stato?.name() == 'COMPLETATA'}" class="inline-flex items-center justify-center w-8 h-8 rounded disabled:opacity-50 disabled:cursor-not-allowed bg-emerald-50 text-emerald-600 hover:bg-emerald-100 transition-colors" title="Segna completata">
                                <i class="bi bi-check-lg text-lg"></i>
                            </button>
                        </form>
                        <a th:href="@{/scadenze/{id}/modifica(id=${s.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors" title="Modifica">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" th:action="@{/scadenze/{id}/elimina(id=${s.id})}" class="inline-block" onsubmit="return confirm('Eliminare questa scadenza?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="inline-flex items-center justify-center w-8 h-8 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" title="Elimina">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(scadenze)}">
                    <td colspan="6" class="px-6 py-12 text-center text-slate-500">Nessuna scadenza trovata.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
