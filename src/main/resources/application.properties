
# =============================================
# Gestionale Studi Commerciali - Configurazione
# =============================================

# Server
server.port=8080
spring.application.name=gestionale

# --- Database PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/gestionale_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (migrazioni DB) ---
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Spring Security ---


# --- Upload documenti ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.com.studicommerciali=DEBUG
logging.level.org.springframework.security=WARN

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tuoindirizzo@gmail.com
spring.mail.password=la_tua_password_di_16_lettere
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CONFIGURAZIONE GOOGLE
spring.security.oauth2.client.registration.google.client-id=INSERISCI_QUI_IL_TUO_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=INSERISCI_QUI_IL_TUO_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email

